name: Build test packages and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check build version and release tag
        id: metadata
        run: python3 scripts/ci_metadata.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Check Go core in both editions
        working-directory: native
        run: |
          go vet ./...
          go test -count=1 -timeout 2m ./...
          go test -count=1 -timeout 2m -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true test/player_navigation_test.dart test/live_epg_test.dart test/live_programme_guide_test.dart test/live_screen_test.dart test/live_playback_menu_test.dart test/live_repository_test.dart test/live_playback_test.dart test/live_parser_test.dart test/live_orientation_test.dart test/live_store_test.dart test/playback_diagnostics_test.dart test/playback_preloader_test.dart test/player_series_test.dart test/sources_test.dart test/library_workflow_test.dart test/imported_sources_test.dart
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true test/imported_sources_test.dart

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
      - name: Configure Android signing
        run: python scripts/configure_signing.py --edition ${{ matrix.edition }} ${{ needs.checks.outputs.release == 'true' && '--require-release' || '' }}
        env:
          ANDROID_HONGGUOJIAN_KEYSTORE_BASE64: ${{ secrets.ANDROID_HONGGUOJIAN_KEYSTORE_BASE64 }}
          ANDROID_HONGGUOJIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HONGGUOJIAN_KEYSTORE_PASSWORD }}
          ANDROID_HONGGUOJIAN_KEY_ALIAS: ${{ secrets.ANDROID_HONGGUOJIAN_KEY_ALIAS }}
          ANDROID_HONGGUOJIAN_KEY_PASSWORD: ${{ secrets.ANDROID_HONGGUOJIAN_KEY_PASSWORD }}
          ANDROID_ZHENGUOJIAN_KEYSTORE_BASE64: ${{ secrets.ANDROID_ZHENGUOJIAN_KEYSTORE_BASE64 }}
          ANDROID_ZHENGUOJIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ZHENGUOJIAN_KEYSTORE_PASSWORD }}
          ANDROID_ZHENGUOJIAN_KEY_ALIAS: ${{ secrets.ANDROID_ZHENGUOJIAN_KEY_ALIAS }}
          ANDROID_ZHENGUOJIAN_KEY_PASSWORD: ${{ secrets.ANDROID_ZHENGUOJIAN_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: checks
    if: needs.checks.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Add MinGW64 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.checks.outputs.release == 'true'
    needs: [checks, android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts
      - name: Collect packages and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path
          output = Path('release-packages')
          output.mkdir()
          packages = sorted(path for path in Path('artifacts').rglob('*')
                            if path.is_file() and path.suffix in {'.apk', '.zip', '.ipa'})
          if len(packages) != 10:
              raise SystemExit(f'预期 10 个安装包，实际 {len(packages)} 个。')
          checksums = []
          for source in packages:
              target = output / source.name
              if target.exists():
                  raise SystemExit('安装包名称冲突：' + source.name)
              shutil.copy2(source, target)
              with target.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              checksums.append(digest + '  ' + target.name)
          (output / 'SHA256SUMS.txt').write_text('\n'.join(sorted(checksums)) + '\n', encoding='ascii')
          PY
      - name: Publish formal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-packages/* --verify-tag --title "真果鉴 / 红果鉴 $RELEASE_TAG" --generate-notes
