name: Build Android 6 formal releases

on:
  push:
    tags: ['android6-[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: android6-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android6:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check compatibility version and release tag
        id: metadata
        run: python3 scripts/ci_metadata.py --prefix android6- --manifest pubspec.android6.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install Android NDK and SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Configure Android 6 toolchain
        run: |
          cp pubspec.android6.yaml pubspec.yaml
          python scripts/prepare_android6_toolchain.py
          python scripts/prepare_android6_sources.py
      - name: Configure Android signing
        run: python scripts/configure_signing.py ${{ steps.metadata.outputs.release == 'true' && '--require-release' || '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android6.py
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-hongguojian-android6
          path: dist/android6/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.android6.outputs.release == 'true'
    needs: android6
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}-hongguojian-android6
          path: release-packages
      - name: Publish formal compatibility release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-packages/* --verify-tag --title "红果鉴 Android 6 兼容版 $RELEASE_TAG" --generate-notes
